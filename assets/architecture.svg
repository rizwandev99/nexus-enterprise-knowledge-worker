<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#090a0f; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a27" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1017" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#14b8a6"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Outer Background Canvas -->
  <rect width="1000" height="680" rx="12" fill="#090a0f"/>
  <rect x="15" y="15" width="970" height="650" rx="10" fill="url(#bgGlow)" stroke="#1e2235" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="40" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">NEXUS ENTERPRISE AGENT ARCHITECTURE</text>
  <rect x="40" y="64" width="370" height="2" fill="url(#brandGrad)"/>
  <text x="810" y="52" fill="#64748b" font-size="12" font-family="monospace">v1.0 • PRODUCTION GRADE</text>

  <!-- ── 1. USER & INGESTION LAYER ── -->
  <g transform="translate(40, 95)">
    <!-- User Client Node -->
    <rect x="0" y="0" width="220" height="74" rx="8" fill="#131622" stroke="#2a304a" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="37" r="14" fill="#1e293b"/>
    <text x="28" y="42" fill="#38bdf8" font-size="14" text-anchor="middle">👤</text>
    <text x="54" y="32" fill="#f1f5f9" font-size="14" font-weight="600">Client Workspace</text>
    <text x="54" y="50" fill="#94a3b8" font-size="11">React 19 / Vercel AI SDK</text>

    <!-- Arrow to Next.js API -->
    <path d="M 220 37 L 270 37" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- Next.js API Route -->
    <rect x="280" y="0" width="240" height="74" rx="8" fill="#131622" stroke="#14b8a6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="300" y="30" fill="#2dd4bf" font-size="14" font-weight="600">⚡ /api/chat &amp; Stream</text>
    <text x="300" y="50" fill="#94a3b8" font-size="11">SSE Streaming + LangGraph Thread</text>

    <!-- Arrow from API to LangGraph Boundary -->
    <path d="M 520 37 L 570 37" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- Document Parser Box -->
    <rect x="600" y="0" width="340" height="74" rx="8" fill="#131622" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="620" y="30" fill="#f8fafc" font-size="14" font-weight="600">📄 /api/parse-document</text>
    <text x="620" y="50" fill="#94a3b8" font-size="11">PDF (pdf-parse), CSV, JSON, MD, Source Code</text>
  </g>

  <!-- ── 2. LANGGRAPH STATE MACHINE CONTAINER ── -->
  <g transform="translate(40, 205)">
    <!-- Container Box -->
    <rect x="0" y="0" width="920" height="280" rx="10" fill="#0f121d" stroke="#312e81" stroke-dasharray="6,6" stroke-width="1.5"/>
    <rect x="20" y="-12" width="240" height="24" rx="4" fill="#312e81"/>
    <text x="140" y="4" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">LANGGRAPH.JS STATE MACHINE</text>

    <!-- Node 1: Researcher (RAG) -->
    <rect x="30" y="40" width="230" height="90" rx="8" fill="#171b2b" stroke="#4338ca" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="48" y="70" fill="#a5b4fc" font-size="14" font-weight="700">1. Researcher (ragNode)</text>
    <text x="48" y="92" fill="#94a3b8" font-size="11">Hybrid Search (pgvector +</text>
    <text x="48" y="108" fill="#94a3b8" font-size="11">tsvector RRF Fusion)</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 260 85 L 320 85" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

    <!-- Node 2: Reasoning Engine -->
    <rect x="330" y="40" width="240" height="90" rx="8" fill="#171b2b" stroke="#6366f1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="348" y="70" fill="#c7d2fe" font-size="14" font-weight="700">2. Reasoning Engine</text>
    <text x="348" y="92" fill="#94a3b8" font-size="11">GPT-4o / Claude Inference</text>
    <text x="348" y="108" fill="#94a3b8" font-size="11">Tool Calling &amp; Plan Generation</text>

    <!-- Conditional Arrow to Tools / HITL -->
    <path d="M 570 85 L 630 85" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

    <!-- Node 3: Execution (ToolsNode) -->
    <rect x="640" y="40" width="250" height="90" rx="8" fill="#171b2b" stroke="#14b8a6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="658" y="70" fill="#2dd4bf" font-size="14" font-weight="700">3. Execution Node (toolsNode)</text>
    <text x="658" y="92" fill="#94a3b8" font-size="11">add_document, SQL Queries,</text>
    <text x="658" y="108" fill="#94a3b8" font-size="11">SQL Mutations (Allowlisted DML)</text>

    <!-- HITL Interrupt Box -->
    <rect x="440" y="160" width="310" height="85" rx="8" fill="#1c1917" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="460" y="188" fill="#fcd34d" font-size="13" font-weight="700">🛡️ HITL Approval Boundary</text>
    <text x="460" y="208" fill="#e2e8f0" font-size="11">interrupt() triggers on SQL mutations</text>
    <text x="460" y="226" fill="#a8a29e" font-size="10">Resumes only upon Human UI Confirmation</text>

    <!-- Self Correction Loop Arrow -->
    <path d="M 760 130 L 760 148 L 380 148 L 380 130" fill="none" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
    <text x="560" y="142" fill="#fbbf24" font-size="10" text-anchor="middle">Cyclic Self-Correction (Error Feedback)</text>

    <!-- Direct connection from HITL to ToolsNode -->
    <path d="M 640 160 L 680 130" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  </g>

  <!-- ── 3. DATA & PERSISTENCE LAYER ── -->
  <g transform="translate(40, 515)">
    <!-- PostgreSQL Box -->
    <rect x="0" y="0" width="600" height="125" rx="8" fill="#131622" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="32" fill="#38bdf8" font-size="15" font-weight="700">🗄️ PostgreSQL Database (Prisma Postgres / pgvector)</text>
    
    <!-- Mini storage items -->
    <rect x="25" y="48" width="165" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="70" fill="#93c5fd" font-size="12" font-weight="600">pgvector Storage</text>
    <text x="35" y="88" fill="#64748b" font-size="10">1536-dim Embeddings</text>

    <rect x="205" y="48" width="175" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="215" y="70" fill="#93c5fd" font-size="12" font-weight="600">tsvector Full-Text</text>
    <text x="215" y="88" fill="#64748b" font-size="10">English Keyword Index</text>

    <rect x="395" y="48" width="185" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="405" y="70" fill="#93c5fd" font-size="12" font-weight="600">PostgresSaver State</text>
    <text x="405" y="88" fill="#64748b" font-size="10">Serverless Checkpoints</text>

    <!-- Telemetry Box -->
    <rect x="630" y="0" width="290" height="125" rx="8" fill="#131622" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="650" y="32" fill="#c084fc" font-size="15" font-weight="700">📊 OpenTelemetry (OTel)</text>
    <text x="650" y="60" fill="#cbd5e1" font-size="12">• LLM Generation Tracing</text>
    <text x="650" y="80" fill="#cbd5e1" font-size="12">• Tool Execution Telemetry</text>
    <text x="650" y="100" fill="#cbd5e1" font-size="12">• Next.js 15 Instrumentation</text>
  </g>
</svg>
