version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nexus_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nexus_jaeger
    restart: always
    ports:
      - "4318:4318" # This is the port Next.js is sending data to!
      - "16686:16686" # This is the dashboard UI port

volumes:
  nexus_pgdata:
