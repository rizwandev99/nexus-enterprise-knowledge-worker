name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --run

      # E2E tests require a running server — run manually or in a separate deployment-gated pipeline.
      # To run E2E locally: npm run test:e2e  (requires: npm run dev in another terminal)
      # - name: Run E2E Tests
      #   run: npx playwright install --with-deps && npm run test:e2e

      - name: Build Project
        run: npm run build
